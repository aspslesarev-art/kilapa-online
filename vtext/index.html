  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>VText — Hold. Speak. Done.<\u002Ftitle>\n<style>\n  :root {\n    --paper: oklch(0.976 0.014 82);\n    --paper-2: oklch(0.945 0.026 78);\n    --card: oklch(0.995 0.006 90);\n    --ink: oklch(0.245 0.045 45);\n    --ink-soft: oklch(0.42 0.045 48);\n    --muted: oklch(0.56 0.035 55);\n    --amber: oklch(0.605 0.19 45);\n    --amber-strong: oklch(0.55 0.205 42);\n    --coral: oklch(0.57 0.20 30);\n    --honey: oklch(0.82 0.13 78);\n    --line: oklch(0.90 0.02 72);\n    --line-soft: oklch(0.93 0.015 74);\n    --shadow: 0 30px 70px -30px oklch(0.35 0.08 45 / 0.35);\n    --font-display: -apple-system, \"SF Pro Display\", \"Helvetica Neue\", system-ui, sans-serif;\n    --font-body: -apple-system, \"SF Pro Text\", \"Helvetica Neue\", system-ui, sans-serif;\n    --maxw: 1180px;\n  }\n\n  * { box-sizing: border-box; }\n  html { scroll-behavior: smooth; }\n  body {\n    margin: 0;\n    font-family: var(--font-body);\n    color: var(--ink);\n    background: var(--paper);\n    -webkit-font-smoothing: antialiased;\n    font-size: 17px;\n    line-height: 1.55;\n  }\n  h1, h2, h3, .display { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.025em; line-height: 1.05; margin: 0; }\n  a { color: inherit; text-decoration: none; }\n  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 32px; }\n  section { position: relative; }\n\n  /* ── glyph / app icon ─────────────────────────────────────── */\n  .app-icon {\n    display: inline-flex; align-items: center; justify-content: center;\n    background: var(--amber); border-radius: 24%;\n    box-shadow: 0 6px 16px -6px oklch(0.55 0.2 42 / 0.6);\n  }\n  .app-icon svg { width: 68%; height: 68%; color: var(--paper); }\n\n  /* ── buttons ──────────────────────────────────────────────── */\n  .btn {\n    display: inline-flex; align-items: center; gap: 10px;\n    font-family: var(--font-body); font-weight: 600; font-size: 16px;\n    padding: 14px 24px; border-radius: 13px; border: none; cursor: pointer;\n    transition: transform .12s ease, box-shadow .2s ease, background .2s ease;\n    white-space: nowrap;\n  }\n  .btn-primary {\n    background: var(--amber); color: var(--paper);\n    box-shadow: 0 10px 24px -10px oklch(0.55 0.2 42 / 0.7);\n  }\n  .btn-primary:hover { background: var(--amber-strong); transform: translateY(-2px); box-shadow: 0 16px 30px -12px oklch(0.55 0.2 42 / 0.75); }\n  .btn-primary:active { transform: translateY(0); }\n  .btn svg.apple { width: 17px; height: 17px; }\n\n  /* ── nav ──────────────────────────────────────────────────── */\n  #nav {\n    position: sticky; top: 0; z-index: 60;\n    transition: background .25s ease, border-color .25s ease, backdrop-filter .25s ease;\n    border-bottom: 1px solid transparent;\n  }\n  #nav.scrolled {\n    background: oklch(0.976 0.014 82 / 0.82);\n    backdrop-filter: blur(14px) saturate(1.1);\n    -webkit-backdrop-filter: blur(14px) saturate(1.1);\n    border-bottom-color: var(--line);\n  }\n  .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 72px; }\n  .brand { display: flex; align-items: center; gap: 11px; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -0.02em; }\n  .brand .app-icon { width: 34px; height: 34px; }\n  .nav-links { display: flex; align-items: center; gap: 30px; }\n  .nav-links a.link { font-size: 15px; font-weight: 500; color: var(--ink-soft); transition: color .15s; }\n  .nav-links a.link:hover { color: var(--ink); }\n  .btn-sm { padding: 10px 18px; font-size: 15px; border-radius: 11px; }\n\n  /* language switcher */\n  .lang { position: relative; }\n  .lang-btn { display: inline-flex; align-items: center; gap: 6px; background: transparent; border: 1px solid var(--line); color: var(--ink-soft); font-family: var(--font-body); font-weight: 600; font-size: 14px; padding: 8px 12px; border-radius: 10px; cursor: pointer; transition: border-color .15s, color .15s; }\n  .lang-btn:hover { border-color: var(--muted); color: var(--ink); }\n  .lang-btn .chev { transition: transform .2s; }\n  .lang.open .lang-btn .chev { transform: rotate(180deg); }\n  .lang-menu { position: absolute; top: calc(100% + 8px); right: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px; min-width: 172px; box-shadow: 0 20px 44px -16px oklch(0.35 0.08 45 / 0.4); display: none; flex-direction: column; gap: 2px; z-index: 80; }\n  .lang.open .lang-menu { display: flex; }\n  .lang-opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 12px; border-radius: 8px; font-size: 14.5px; font-weight: 500; color: var(--ink); cursor: pointer; background: transparent; border: none; text-align: left; font-family: var(--font-body); width: 100%; }\n  .lang-opt:hover { background: var(--paper-2); }\n  .lang-opt .tick { color: var(--amber); opacity: 0; font-size: 13px; }\n  .lang-opt.active { color: var(--amber-strong); font-weight: 600; }\n  .lang-opt.active .tick { opacity: 1; }\n  [dir=\"rtl\"] .lang-menu { right: auto; left: 0; }\n  [dir=\"rtl\"] .lang-opt { text-align: right; }\n  [dir=\"rtl\"] .hero .sub, [dir=\"rtl\"] .sec-head p { max-width: none; }\n\n  /* ── hero ─────────────────────────────────────────────────── */\n  .hero { padding: 74px 0 90px; overflow: hidden; }\n  .hero::before {\n    content: \"\"; position: absolute; inset: 0; z-index: 0; pointer-events: none;\n    background:\n      radial-gradient(60% 55% at 82% 20%, oklch(0.8 0.13 66 / 0.5) 0%, transparent 62%),\n      radial-gradient(50% 50% at 8% 92%, oklch(0.72 0.14 40 / 0.3) 0%, transparent 60%);\n  }\n  .hero .wrap { position: relative; z-index: 1; display: grid; grid-template-columns: 1.02fr 1fr; gap: 60px; align-items: center; }\n  .eyebrow {\n    display: inline-flex; align-items: center; gap: 8px;\n    font-size: 13.5px; font-weight: 600; letter-spacing: 0.02em;\n    color: var(--amber-strong); background: oklch(0.9 0.06 66 / 0.6);\n    padding: 6px 13px; border-radius: 999px; margin-bottom: 24px;\n    border: 1px solid oklch(0.8 0.08 60 / 0.5);\n  }\n  .eyebrow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }\n  .hero h1 { font-size: clamp(48px, 6.4vw, 82px); font-weight: 800; }\n  .hero h1 .b { color: var(--amber); }\n  .hero .sub { font-size: 20px; color: var(--ink-soft); margin: 24px 0 34px; max-width: 30ch; }\n  .hero-cta { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }\n  .hero-meta { font-size: 14px; color: var(--muted); }\n  .hero-meta b { color: var(--ink-soft); font-weight: 600; }\n\n  /* ── hero mockup ──────────────────────────────────────────── */\n  .hero-stage { position: relative; z-index: 1; }\n  .mac-window {\n    position: relative; background: var(--card); border-radius: 16px;\n    border: 1px solid var(--line);\n    box-shadow: var(--shadow);\n    overflow: visible;\n  }\n  .menubar {\n    display: flex; align-items: center; justify-content: space-between;\n    height: 30px; padding: 0 12px;\n    background: oklch(0.99 0.005 90 / 0.9);\n    border-bottom: 1px solid var(--line-soft);\n    border-radius: 16px 16px 0 0;\n    font-size: 12.5px; color: var(--ink-soft);\n  }\n  .mb-left { display: flex; align-items: center; gap: 14px; }\n  .mb-left .app { font-weight: 700; }\n  .mb-left .mi { color: var(--muted); font-weight: 500; }\n  .mb-right { display: flex; align-items: center; gap: 13px; color: var(--ink-soft); }\n  .mb-right .vt-mb {\n    width: 19px; height: 19px; border-radius: 5px; background: var(--amber);\n    display: inline-flex; align-items: center; justify-content: center;\n    position: relative;\n  }\n  .mb-right .vt-mb svg { width: 72%; height: 72%; color: var(--paper); }\n  .mb-right .vt-mb::after {\n    content: \"\"; position: absolute; inset: -4px; border-radius: 8px;\n    border: 2px solid var(--amber); opacity: 0; transition: opacity .3s;\n  }\n  [data-phase=\"recording\"] .mb-right .vt-mb::after,\n  [data-phase=\"processing\"] .mb-right .vt-mb::after { opacity: 0.5; }\n  .mb-ic { opacity: 0.7; }\n\n  .chat { padding: 20px 20px 18px; }\n  .chat-head { display: flex; align-items: center; gap: 9px; padding-bottom: 14px; border-bottom: 1px solid var(--line-soft); margin-bottom: 16px; }\n  .chat-head .ava { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, oklch(0.7 0.13 55), oklch(0.6 0.16 30)); }\n  .chat-head .who { font-weight: 600; font-size: 14.5px; }\n  .chat-head .stat { font-size: 12px; color: oklch(0.6 0.13 150); }\n  .messages { display: flex; flex-direction: column; gap: 9px; min-height: 128px; justify-content: flex-end; }\n  .msg { max-width: 82%; padding: 9px 13px; border-radius: 15px; font-size: 14px; line-height: 1.4; }\n  .msg.in { align-self: flex-start; background: var(--paper-2); color: var(--ink); border-bottom-left-radius: 5px; }\n  .msg.out { align-self: flex-end; background: var(--amber); color: var(--paper); border-bottom-right-radius: 5px; }\n  .msg.fresh { animation: pop .32s cubic-bezier(.2,.9,.3,1.2); }\n  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.96); } to { opacity: 1; transform: none; } }\n\n  .composer {\n    margin-top: 14px; display: flex; align-items: center; gap: 9px;\n    border: 1.5px solid var(--line); border-radius: 13px; padding: 7px 7px 7px 15px;\n    transition: border-color .25s;\n  }\n  [data-phase=\"writing\"] .composer { border-color: var(--amber); }\n  .input { flex: 1; font-size: 14.5px; min-height: 22px; color: var(--ink); }\n  .input.placeholder { color: oklch(0.72 0.02 70); }\n  .input.typing::after { content: \"▏\"; color: var(--amber); animation: blink 1s steps(1) infinite; margin-left: -2px; }\n  @keyframes blink { 50% { opacity: 0; } }\n  .send { width: 30px; height: 30px; border-radius: 9px; border: none; background: var(--paper-2); color: var(--muted); font-size: 15px; display: grid; place-items: center; cursor: default; transition: background .2s, color .2s; }\n  [data-phase=\"writing\"] .send, [data-phase=\"sent\"] .send { background: var(--amber); color: var(--paper); }\n\n  /* floating pill */\n  .pill {\n    position: absolute; left: 50%; bottom: 74px; transform: translate(-50%, 10px);\n    display: flex; align-items: center; gap: 11px;\n    background: oklch(0.24 0.045 45 / 0.96); color: var(--paper);\n    padding: 10px 16px; border-radius: 999px;\n    box-shadow: 0 18px 40px -14px oklch(0.2 0.05 45 / 0.6);\n    opacity: 0; pointer-events: none; transition: opacity .3s ease, transform .3s ease;\n    z-index: 5; white-space: nowrap;\n  }\n  [data-phase=\"recording\"] .pill, [data-phase=\"processing\"] .pill { opacity: 1; transform: translate(-50%, 0); }\n  .rec-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--coral); animation: recpulse 1.3s ease-in-out infinite; }\n  @keyframes recpulse { 50% { opacity: .4; transform: scale(1.25); } }\n  [data-phase=\"processing\"] .rec-dot { background: var(--honey); }\n  .wave { display: flex; align-items: center; gap: 2.5px; height: 22px; }\n  .wbar { width: 3px; height: 8%; background: var(--honey); border-radius: 2px; transition: height .08s linear; }\n  .pill-label { font-size: 13.5px; font-weight: 600; letter-spacing: 0.01em; }\n\n  /* raw caption */\n  .raw-cap {\n    position: absolute; left: 20px; right: 20px; bottom: -14px;\n    transform: translateY(100%);\n    display: flex; gap: 10px; align-items: baseline;\n    font-size: 13px; color: var(--muted); opacity: 0; transition: opacity .3s;\n  }\n  .raw-tag { flex: 0 0 auto; font-weight: 600; color: var(--coral); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; padding-top: 1px; }\n  .raw-text { font-style: italic; line-height: 1.4; }\n  .mode-badge {\n    position: absolute; top: 42px; right: 16px;\n    background: var(--amber); color: var(--paper);\n    font-size: 11.5px; font-weight: 700; letter-spacing: 0.02em;\n    padding: 4px 10px; border-radius: 999px; opacity: 0;\n    transform: translateY(-4px); transition: opacity .3s, transform .3s;\n  }\n  [data-phase=\"writing\"] .mode-badge, [data-phase=\"sent\"] .mode-badge { opacity: 1; transform: none; }\n\n  /* ── section scaffolding ──────────────────────────────────── */\n  .band { padding: 96px 0; }\n  .band.paper2 { background: var(--paper-2); }\n  .band.ink { background: var(--ink); color: var(--paper); }\n  .sec-head { max-width: 640px; margin-bottom: 52px; }\n  .sec-tag { font-size: 13.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--amber-strong); margin-bottom: 14px; }\n  .band.ink .sec-tag { color: var(--honey); }\n  .sec-head h2 { font-size: clamp(32px, 4vw, 46px); }\n  .sec-head p { font-size: 18.5px; color: var(--ink-soft); margin: 16px 0 0; }\n  .band.ink .sec-head p { color: oklch(0.82 0.03 72); }\n\n  [data-reveal] { opacity: 0; transform: translateY(22px); transition: opacity .7s ease, transform .7s cubic-bezier(.2,.7,.3,1); }\n  [data-reveal].in { opacity: 1; transform: none; }\n  [data-reveal][data-d=\"1\"] { transition-delay: .08s; }\n  [data-reveal][data-d=\"2\"] { transition-delay: .16s; }\n  [data-reveal][data-d=\"3\"] { transition-delay: .24s; }\n  [data-reveal][data-d=\"4\"] { transition-delay: .32s; }\n\n  /* steps */\n  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }\n  .step { }\n  .step .n { font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--amber); width: 34px; height: 34px; border: 1.5px solid var(--amber); border-radius: 50%; display: grid; place-items: center; margin-bottom: 20px; }\n  .step h3 { font-size: 21px; margin-bottom: 9px; }\n  .step p { color: var(--ink-soft); font-size: 16px; margin: 0; }\n  .step .kbd { display: inline-block; font-family: var(--font-body); font-weight: 600; font-size: 13px; background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 2px 8px; color: var(--ink); }\n\n  /* modes */\n  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }\n  .mode {\n    background: var(--card); border: 1px solid var(--line); border-radius: 20px;\n    padding: 34px 32px; position: relative; overflow: hidden;\n  }\n  .mode .micon { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 22px; }\n  .mode.t .micon { background: oklch(0.9 0.05 240 / 0.5); color: oklch(0.5 0.13 250); }\n  .mode.s .micon { background: oklch(0.9 0.07 66 / 0.7); color: var(--amber-strong); }\n  .mode h3 { font-size: 25px; margin-bottom: 12px; }\n  .mode p { color: var(--ink-soft); font-size: 16.5px; margin: 0 0 22px; }\n  .mode .demo-line { font-size: 14px; border-top: 1px dashed var(--line); padding-top: 16px; }\n  .mode .demo-line .lab { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; color: var(--muted); display: block; margin-bottom: 5px; }\n  .mode .demo-line .said { color: var(--muted); font-style: italic; margin-bottom: 12px; }\n  .mode .demo-line .got { color: var(--ink); font-weight: 500; }\n  .modes-note { text-align: center; margin-top: 28px; color: var(--ink-soft); font-size: 15.5px; }\n  .modes-note .kbd { font-weight: 600; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 2px 8px; font-size: 13px; }\n\n  /* facts */\n  .facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }\n  .fact { background: var(--paper); padding: 26px 24px; }\n  .fact .fi { color: var(--amber); margin-bottom: 14px; display: block; }\n  .fact .fi svg { width: 24px; height: 24px; display: block; }\n  .fact h3 { font-size: 17.5px; margin-bottom: 7px; letter-spacing: -0.01em; }\n  .fact p { font-size: 14.5px; color: var(--ink-soft); margin: 0; line-height: 1.45;
