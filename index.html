<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Kelappa — Calm apps for restless minds</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesque:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<style>
  html, body { margin: 0; padding: 0; background: oklch(0.965 0.014 82); font-family: 'Plus Jakarta Sans', sans-serif; color: oklch(0.225 0.020 60); -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  a { color: inherit; }
  ::selection { background: oklch(0.795 0.108 38); color: oklch(0.965 0.014 82); }
  html { scroll-behavior: smooth; }
  /* email gate accent (see /email-gate.js) */
  :root { --kg-accent: oklch(0.460 0.060 55); --kg-accent-fg: oklch(0.965 0.014 82); }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="app"></div>

<!-- Reuse existing brand atoms (just MarkDots + KelappaLogo + FinalIcon) -->
<script type="text/babel" src="pairings.jsx"></script>
<script type="text/babel" src="logo-final.jsx"></script>
<script type="text/babel" src="brand-final.jsx"></script>
<script type="text/babel" src="landing-copy.jsx"></script>
<script type="text/babel" src="landing-apps.jsx"></script>
<script type="text/babel" src="landing.jsx"></script>

<script type="text/babel">
// Palette — locked Bali Sunrise
const t = {
  cream:   'oklch(0.965 0.014 82)',
  shell:   'oklch(0.915 0.030 78)',
  sand:    'oklch(0.875 0.045 75)',
  coral:   'oklch(0.795 0.108 38)',
  saffron: 'oklch(0.860 0.095 78)',
  lagoon:  'oklch(0.845 0.060 215)',
  palm:    'oklch(0.795 0.070 155)',
  husk:    'oklch(0.430 0.045 52)',
  ink:     'oklch(0.225 0.020 60)',
};

ReactDOM.createRoot(document.getElementById('app')).render(<Landing t={t} />);
</script>

<!-- Email gate: every .dmg click asks for an email before the download starts. -->
<script defer src="/email-gate.js"></script>
</body>
</html>
